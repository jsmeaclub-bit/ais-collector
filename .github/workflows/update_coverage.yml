name: update_coverage

on:
  workflow_dispatch:
  schedule:
    # 毎日 UTC 19:30 (日本時間 04:30) に実行
    # ais_collector の 12分・42分 の実行とは完全に時間がずれるため競合しません。
    - cron: '30 19 * * *'

jobs:
  update-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install websockets shapely gspread google-auth

      - name: Run Global AIS Coverage Collector
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          python update_coverage.py

      - name: Commit and Push Coverage
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/coverage.json data/coverage_points.json
          if ! git diff --staged --quiet; then
            git commit -m "Update global AIS coverage map [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
