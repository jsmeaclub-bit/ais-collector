name: update_coverage

on:
  workflow_dispatch:

jobs:
  update-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install websockets shapely

      - name: Run Global AIS Coverage Collector
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: |
          python update_coverage.py

      - name: Commit and Push Coverage
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/coverage_2026.json data/coverage_points.json
          if ! git diff --staged --quiet; then
            git commit -m "Update global AIS coverage map [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
