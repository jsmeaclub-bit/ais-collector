name: ais_collector

on:
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch:

jobs:
  collect-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install searoute shapely scipy numpy websockets requests gspread google-auth

      - name: Run AIS Collector and Route Builder
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: |
          python main.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes detected in data directory."
          else
            git commit -m "Auto-update fleet data and tracks [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
