name: Scheduled AIS Collection & Route Update

on:
  schedule:
    # 毎時0分と30分の30分間隔で定期実行（必要に応じて間隔は調整可能）
    - cron: '*/30 * * * *'
  workflow_dispatch: # 手動実行ボタンも維持

permissions:
  contents: write

jobs:
  collect-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install websockets requests shapely searoute

      # ステップ1: AIS電波の収集とGAS更新（約3分間）
      - name: Run AIS Collector
        env:
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: |
          python main.py

      # ステップ2: 航跡結合とダイナミックカバレッジ計算（約20秒）
      - name: Process Routes and Coverage
        env:
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        run: |
          python process_routes.py

      # ステップ3: 生成された最新JSONをGitHubリポジトリへ反映
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/routes_2026.json data/coverage_2026.json
          git diff --staged --quiet || (git commit -m "Auto-update: Ship tracks and dynamic coverage [skip ci]" && git push)
