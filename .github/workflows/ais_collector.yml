name: Scheduled AIS Collection & Route Update

on:
  schedule:
    # 毎時0分と30分の30分間隔で定期実行
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install websockets requests shapely searoute

      # 収集・軌跡生成・完全同期キャッシュ生成を1本で実行（約3分20秒）
      - name: Run AIS Collector and Route Builder
        env:
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: |
          python main.py

      # 生成された最新JSON（routes, coverage, latest）をGitHubへ反映
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || (git commit -m "Auto-update: Ship tracks, positions, and coverage [skip ci]" && git push)
