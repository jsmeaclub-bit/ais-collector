name: Scheduled AIS Collection

on:
  schedule:
    # 15分ごとに実行（毎時 0分, 15分, 30分, 45分）
    - cron: '*/15 * * * *'
  
  # 手動実行ボタンも残す
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install websockets requests

      - name: Run AIS Collector
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        run: |
          python main.py
