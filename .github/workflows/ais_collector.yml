name: Scheduled AIS Collection

on:
  schedule:
    # 毎日 朝6時、12時、18時（UTC時間）に自動実行
    - cron: '0 6,12,18 * * *'
  # 手動実行ボタン
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 必要なライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install websockets requests

      - name: AISスクリプトを実行
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
        run: |
          python main.py
